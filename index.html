<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="card">
  <p class="eyebrow">Body composition</p>
  <h1>BMI Calculator</h1>
  <p class="subtitle">Enter your height and weight to see where you land.</p>

  <form id="bmi-form" novalidate>
    <div class="field">
      <label for="height">Height (cm)</label>
      <input type="number" id="height" name="height" placeholder="e.g. 172" min="1" step="0.1" inputmode="decimal">
      <span class="error" id="height-error"></span>
    </div>

    <div class="field">
      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight" placeholder="e.g. 68" min="1" step="0.1" inputmode="decimal">
      <span class="error" id="weight-error"></span>
    </div>

    <button type="submit" id="calculate-btn">Calculate BMI</button>
  </form>

  <section id="result" class="result" hidden>
    <div class="result-value">
      <span id="bmi-number">0</span>
      <span class="result-label">BMI</span>
    </div>
    <p id="bmi-category" class="category"></p>
    <div class="scale">
      <div class="scale-bar">
        <div class="scale-segment underweight">Underweight</div>
        <div class="scale-segment normal">Normal</div>
        <div class="scale-segment overweight">Overweight</div>
        <div class="scale-segment obese">Obese</div>
      </div>
      <div class="scale-marker" id="scale-marker"></div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
